# SPDX-License-Identifier: MIT

kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: "oai-spgwc-build-config"
spec:
    runPolicy: "Serial"
    source:
        git:
            uri: "https://github.com/OPENAIRINTERFACE/openair-spgwc.git"
            ref: "develop"
            httpProxy: http://proxy.eurecom.fr:8080
            httpsProxy: https://proxy.eurecom.fr:8080
        secrets:
          - secret:
              name: etc-pki-entitlement
            destinationDir: etc-pki-entitlement
        configMaps:
          - configMap:
              name: rhsm-conf
            destinationDir: rhsm-conf
          - configMap:
              name: rhsm-ca
            destinationDir: rhsm-ca
    strategy:
        dockerStrategy:
            dockerfilePath: "docker/Dockerfile.rhel8"
            from:
                kind: "ImageStreamTag"
                name: "oai-spgwc:debug-3rd-party"
    output:
        to:
            kind: "ImageStreamTag"
            name: "oai-spgwc:develop"
